@for (work of works; track work.id) {
  <div class="card mb-3 shadow-sm">
    <div class="card-body p-3">
      <div class="d-flex justify-content-between align-items-start gap-3">
        <div class="min-width-0">
          <h5 class="mb-1">{{ work.regNumber | regNumber | uppercase }}</h5>
          <small class="text-muted">{{ work.car | titlecase | carName }}</small>
        </div>
        <span class="badge bg-success fs-6 text-nowrap">{{ work.price | price: 'RON' }} </span>
      </div>

      <p class="mt-3 mb-0">{{ work.desc }}</p>

      <div class="d-flex justify-content-between align-items-center mt-3 gap-2">
        <small class="text-muted fw-semibold text-nowrap">
          {{ work.date | date: 'mediumDate' }}
        </small>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm" (click)="onEditWork(work.id)">Edit</button>
          <button class="btn btn-outline-danger btn-sm" (click)="onDeleteWork(work.id)">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
}
