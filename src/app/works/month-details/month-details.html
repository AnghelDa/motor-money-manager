<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h2 class="mb-1">{{ month.title }}</h2>
        <small class="text-muted">Total incasari: {{ month.totalIncome | price: 'RON' }} </small>
      </div>
      <span class="badge bg-success fs-6">Salariu: {{ month.salary | price: 'RON' }} </span>
    </div>

    <div class="d-flex justify-content-end">
      <button class="btn btn-outline-primary" (click)="onNewWork()">New Work</button>
    </div>
  </div>
</div>

<div class="mb-4">
  <router-outlet></router-outlet>
</div>

<div>
  <h4 class="mb-3">Lucrari</h4>
  <app-work-list [works]="works"></app-work-list>
</div>
